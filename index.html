<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기출 지우개</title>
<meta name="description" content="공인중개사 1차 기출 선지를 OX로 넘기며 확실한 것은 지우고 모르는 것만 남기는 폰 공부 앱">
<meta name="theme-color" content="#f6f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기출 지우개">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#15150f; --ink2:#55534b; --muted:#8a877c; --line:#e3e0d6;
  --o:#1b7f5a; --o-bg:#e4f4ec; --x:#c8322b; --x-bg:#fbe8e6; --acc:#2f63d0; --acc-bg:#e7eefb; --warn:#b26a00; --warn-bg:#fff2dc;
  --del:#6b6b6b; --focus:#e8e6df; --cc:rgba(255,212,0,.6);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15161a; --card:#1f2127; --ink:#f0eee6; --ink2:#c2bfb5; --muted:#8c897f; --line:#33363e;
    --o:#4cc38a; --o-bg:#173427; --x:#ff6b61; --x-bg:#3a1f1d; --acc:#7aa2ff; --acc-bg:#1f2a44; --warn:#ffb84d; --warn-bg:#3a2d14; --focus:#3a3d46; --cc:rgba(255,200,0,.32); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.5}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:800}
.top .sub{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0%}
main{padding:14px 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc-bg);color:var(--acc);margin-right:6px;font-weight:700}
.tag.A{background:#fde7ef;color:#b4134a} .tag.B{background:var(--warn-bg);color:var(--warn)} .tag.C{background:var(--line);color:var(--ink2)}
@media (prefers-color-scheme: dark){ .tag.A{background:#3b1626;color:#ff8ab4} }
.qstem{font-size:14px;color:var(--ink2);margin:8px 0 4px}
.passage{font-size:14px;color:var(--ink2);background:var(--bg);border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;border-radius:6px;white-space:pre-wrap}
.choice{font-size:19px;font-weight:600;margin:10px 0 14px;line-height:1.55}
.choice .red{color:var(--x);text-decoration:line-through;text-decoration-thickness:2px}
.choice .hl{background:#fff3a3;color:#000;border-radius:3px;padding:0 2px}
.choice .focus{background:var(--focus);border-radius:4px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:16px 10px;font-size:20px;font-weight:800;cursor:pointer;color:#fff;touch-action:manipulation}
.btn.o{background:var(--o)} .btn.x{background:var(--x)} .btn.n{background:var(--acc)} .btn.g{background:var(--del)}
.btn.small{font-size:15px;padding:12px 8px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.verdict{font-size:22px;font-weight:900;margin:4px 0}
.verdict.ok{color:var(--o)} .verdict.bad{color:var(--x)}
.reason{margin:8px 0;font-size:16px}
.law{font-size:13px;color:var(--muted)}
.fix{font-size:15px;background:var(--o-bg);color:var(--o);padding:6px 10px;border-radius:8px;margin:6px 0;font-weight:700}
.calc{font-size:14px;white-space:pre-wrap;background:var(--bg);padding:8px 10px;border-radius:8px}
.tip{font-size:14px;background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:8px;margin-top:6px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stat div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 8px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--acc);font-weight:800}
nav.tabs button b{display:block;font-size:20px;line-height:1.1}
details{margin-top:6px} summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:700}
.list button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px;color:var(--ink);cursor:pointer}
.list .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;min-width:30px;text-align:center;border-radius:8px;padding:1px 6px;font-size:12px;font-weight:700;background:var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.exam .q{margin:14px 0 6px;font-weight:700}
.exam .opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px;color:var(--ink)}
.exam .opt.sel{border-color:var(--acc);background:var(--acc-bg)}
.exam .opt.right{border-color:var(--o);background:var(--o-bg)} .exam .opt.wrongsel{border-color:var(--x);background:var(--x-bg)}
.sticky-bottom{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
textarea{width:100%;min-height:80px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px;font-size:13px}
.tok{width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font-size:16px;margin-top:6px}
#syncdot{cursor:pointer} #syncdot.err{color:var(--x);font-weight:800}
.card a{color:var(--acc);font-weight:700}
.hide{display:none !important}
.note{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px}
.center{text-align:center}
h2{font-size:17px;margin:14px 0 8px}
.ask{margin:12px 0 2px;font-size:15px;padding:8px 10px;border-radius:10px}
.ask span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ask.truth{background:var(--o-bg)} .ask.pick{background:var(--acc-bg)}
.ask.member{background:var(--acc-bg);font-size:18px;font-weight:800;line-height:1.45}
.qimg{display:block;width:100%;height:auto;margin:10px 0;border-radius:8px;background:#fff;border:1px solid var(--line)}
.opts{margin:8px 0}.opt-r{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}.opt-r.ok{color:var(--o)}
a.btn{display:block;text-align:center;text-decoration:none}
.card.help{border-color:var(--acc)} .card.easy{border-color:var(--o)}
.ins{color:var(--o);font-weight:800;background:var(--o-bg);border-radius:4px;padding:0 4px;margin-left:3px}
.kind{font-size:13px;color:var(--x);margin:2px 0 6px;font-weight:700}
.trap{font-size:14px;background:var(--warn-bg);color:var(--ink);padding:8px 10px;border-radius:8px;margin:6px 0}
.box{font-size:15px;padding:8px 10px;border-radius:8px;margin:8px 0 0;line-height:1.55}
.box b:not(.kw){display:inline-block;margin-right:6px}
.box.issue{background:var(--acc-bg)} .box.intent{background:var(--x-bg)}
.note.pre{white-space:pre-wrap}
/* 해설 강조: 개념어 굵게(.kw), O/X를 가르는 결론 형광 밑줄(.cc), 조문·판례 번호 작은 회색(.lw) */
b.kw{font-weight:800}
.note .kw,.wy .kw,.oxi .kw,.qref .kw{color:var(--ink)}
.cc{font-weight:800;color:var(--ink);background:linear-gradient(transparent 56%,var(--cc) 56%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 1px}
.tip .cc,.opt-r.ok .cc{color:inherit}
.lw{font-size:.8em;color:var(--muted);font-weight:500;letter-spacing:-.01em}
/* ===== 개념서 ===== */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-size:15px;font-weight:800;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:10px}
.cont{display:block;width:100%;text-align:left;border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;margin-bottom:10px;cursor:pointer}
.cont span{display:block;font-size:12px;font-weight:600;opacity:.85}
.linkbtn{border:0;background:transparent;color:var(--acc);font-weight:800;font-size:14px;cursor:pointer;padding:4px 0}
.chap{padding:0;overflow:hidden}
.chap>.hd{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:14px 16px;cursor:pointer}
.chap>.hd b{font-size:16px}
.chap>.hd .meta{font-size:12px;color:var(--muted);margin-top:3px}
.chap .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.chap .pbar i{display:block;height:100%;background:var(--o)}
.chap .secs{border-top:1px solid var(--line);padding:2px 12px 6px}
.chap .intro{font-size:14px;color:var(--ink2);padding:10px 4px 6px;line-height:1.6}
.srow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 4px;cursor:pointer;font-size:15px}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;line-height:1.4}.srow .f{font-size:12px;color:var(--muted);white-space:nowrap}
.srow.read .t{color:var(--muted)}.srow .ck{color:var(--o);font-weight:900;width:14px}
.reader .crumb{font-size:13px;color:var(--muted);margin:2px 0 4px}
.reader h2.st{font-size:22px;margin:4px 0 6px;line-height:1.35}
.reader .lawl{font-size:13px;color:var(--muted);margin-bottom:6px}
.one{background:var(--acc-bg);border-radius:12px;padding:12px 14px;font-size:16.5px;font-weight:700;line-height:1.6;margin:12px 0}
.one small{display:block;font-size:12px;color:var(--acc);font-weight:800;margin-bottom:2px}
.concept{list-style:none;padding:0;margin:6px 0}
.concept li{position:relative;padding:7px 0 7px 14px;line-height:1.7;font-size:16px;border-bottom:1px dashed var(--line)}
.concept li:last-child{border-bottom:0}
.concept li::before{content:'';position:absolute;left:1px;top:17px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.concept li.sub{padding-left:28px;font-size:15px;color:var(--ink2);border-bottom:0;padding-top:2px}
.concept li.sub::before{left:16px;top:12px;background:var(--muted)}
.tw{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
.tw table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.tw caption{caption-side:top;text-align:left;font-weight:800;font-size:14px;padding:0 0 6px;color:var(--ink)}
.tw th,.tw td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;min-width:64px}
.tw th{background:var(--bg);font-weight:800;font-size:13px}
.tw td:first-child{font-weight:700}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 4px}
.sech h3{font-size:16px;margin:0}
.chipbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.oxl{list-style:none;padding:0;margin:4px 0}
.oxi{padding:11px 0;border-bottom:1px solid var(--line);cursor:default}
.oxi .h{display:flex;gap:10px;align-items:flex-start}
.oxb{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;margin-top:1px}
.oxb.O{background:var(--o)}.oxb.X{background:var(--x)}.oxb.q{background:var(--line);color:var(--ink2)}
.oxi .tx{flex:1;font-size:15.5px;line-height:1.65}
.oxi .rd{display:inline-block;font-size:12px;color:var(--muted);font-weight:800;margin-right:5px}
.oxi .cs{font-size:13.5px;color:var(--ink2);background:var(--bg);border-left:3px solid var(--acc);border-radius:6px;padding:5px 9px;margin:0 0 6px;line-height:1.55}
.oxi .cs b{color:var(--acc);font-size:12px;margin-right:4px}
.oxi .re{font-size:11px;color:var(--muted);margin-left:4px}
.oxi .more{margin:6px 0 0 38px}
.oxi .fx{font-size:15px;background:var(--o-bg);color:var(--ink);padding:6px 10px;border-radius:8px;line-height:1.6}
.oxi .fx ins{text-decoration:none;color:var(--o);font-weight:900}
.oxi del{color:var(--x);text-decoration:line-through;text-decoration-thickness:2px}
.oxi .wy{font-size:14px;color:var(--ink2);margin-top:5px;line-height:1.6}
.oxi .nw{font-size:13px;background:var(--warn-bg);color:var(--warn);padding:4px 8px;border-radius:6px;margin-top:5px}
.oxi .al{font-size:12px;color:var(--muted);margin-top:4px}
.hideans .oxi{cursor:pointer}
.hideans .oxi:not(.open) .oxb{background:var(--line);color:var(--line)}
.hideans .oxi:not(.open) .more{display:none}
.dot{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:800;vertical-align:1px}
.dot.del{background:var(--line);color:var(--ink2)}.dot.miss{background:var(--x-bg);color:var(--x)}.dot.ok{background:var(--o-bg);color:var(--o)}
.trapbox{background:var(--warn-bg);border-radius:12px;padding:10px 14px;margin:14px 0}
.trapbox b:not(.kw){display:block;color:var(--warn);font-size:14px;margin-bottom:4px}
.trapbox li{font-size:15px;line-height:1.6;margin:3px 0}
.memo{background:#fff3a3;color:#1a1a00;border-radius:12px;padding:12px 14px;font-weight:800;margin:14px 0;line-height:1.6;font-size:16px}
.memo small{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
@media (prefers-color-scheme: dark){ .memo{background:#463d0c;color:#fff4bf} }
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
.calcb{border:1.5px solid var(--acc);border-radius:12px;padding:10px 14px;margin:12px 0}
.calcb .nm{font-weight:800;font-size:15px}
.calcb .fm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);padding:8px 10px;border-radius:8px;font-size:14.5px;font-weight:700;white-space:pre-wrap;margin:6px 0;line-height:1.55}
.calcb ol{padding-left:20px;margin:6px 0;font-size:15px;line-height:1.6}
.calcb .ct{font-size:14px;color:var(--x);margin-top:4px}
.calcb .ex{font-size:12px;color:var(--muted)}
.backbar{display:flex;gap:8px;margin-bottom:10px}
.pn{display:flex;gap:8px;margin-top:12px}
.pn button{flex:1;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer;line-height:1.4}
.pn button span{display:block;font-size:11px;color:var(--muted)}
.pn button.nx{text-align:right}
.qref{font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.5}
.hit{font-size:13px;color:var(--ink2);margin-top:2px}
.hit mark{background:#fff3a3;color:#000;border-radius:2px}
.bookbtn{display:block;width:100%;text-align:left;border:1.5px solid var(--acc);background:var(--acc-bg);color:var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:800;margin-top:10px;cursor:pointer}
/* ===== 패턴 ===== */
.tag.S{background:var(--ink);color:var(--bg)}
.patbtn{display:block;width:100%;text-align:left;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:800;margin-top:10px;cursor:pointer}
.patbtn span{font-weight:600;color:var(--muted)}
.pbar2{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.pbar2 i{display:block;height:100%;background:var(--o)}
.pwhen{background:var(--acc-bg);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px;line-height:1.6}
.pwhen small{display:block;font-size:12px;color:var(--acc);font-weight:800;margin-bottom:2px}
.prule{list-style:none;padding:0;margin:10px 0}
.prule li{padding:9px 12px;margin:6px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);font-size:16px;font-weight:600;line-height:1.65}
.pexc{background:var(--warn-bg);border-radius:12px;padding:8px 14px;margin:10px 0;font-size:15px;line-height:1.6}
.pexc b:not(.kw){display:block;color:var(--warn);font-size:13px}
.lesson{padding:10px 0;border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.lesson .k{font-size:12px;color:var(--muted);font-weight:800}
.lesson .say{font-size:15.5px;font-weight:800;line-height:1.55;margin:2px 0}
.lesson .so{font-size:14px;color:var(--ink2);line-height:1.6}
.hb{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.hb .nm{flex:0 0 108px;line-height:1.3}
.hb .tr{flex:1;height:10px;background:var(--line);border-radius:0 5px 5px 0;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.hb .pc{flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.hbex{font-size:11.5px;color:var(--muted);margin:-3px 0 6px 116px;line-height:1.4}
.choice del{color:var(--x);text-decoration:line-through;text-decoration-thickness:2px}
.fix ins{text-decoration:none;font-weight:900;border-bottom:2px solid var(--o)}
.vb{display:flex;gap:6px;align-items:flex-end;height:64px;margin:8px 0 2px}
.vb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.vb i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;margin-top:2px}
.vbl{display:flex;gap:6px;font-size:12px;color:var(--muted)}.vbl span{flex:1;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
/* ===== 연속 기록·회독 ===== */
.streak{font-size:15px;font-weight:800;padding:8px 10px;border-radius:10px;margin:6px 0 4px;background:var(--bg);color:var(--ink2);letter-spacing:-.2px}
.streak.ok{background:var(--o-bg);color:var(--o)} .streak.up{background:var(--acc-bg);color:var(--acc)} .streak.bad{background:var(--x-bg);color:var(--x)}
.prog{border:1.5px solid var(--acc)}
.prog .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .ps{font-size:14px;font-weight:800;color:var(--acc)}
.prog .big{font-size:34px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-1px}

<body>
<header>
  <div class="top"><h1 id="title">기출 지우개</h1><div class="sub"><span id="subtitle">불러오는 중</span><span id="syncdot"></span></div></div>
  <div class="bar"><i id="bar"></i><i id="bar2"></i></div>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-v="today" class="on"><b>▶</b>오늘</button>
  <button data-v="pat"><b>★</b>패턴</button>
  <button data-v="book"><b>▤</b>개념</button>
  <button data-v="concepts"><b>☰</b>논점</button>
  <button data-v="exam"><b>✎</b>실전</button>
  <button data-v="stats"><b>▦</b>현황</button>
  <button data-v="settings"><b>⚙</b>설정</button>
</nav>
<script>
/* ===== 데이터 ===== */
const CIRC='①②③④⑤';
let D=null;              // cards.json
let S=load();            // 진행 상태
const EXAM_DATE=new Date('2026-10-31T00:00:00+09:00'), EXAM_DAY='2026-10-31';

function load(){ try{ return JSON.parse(localStorage.getItem('jiugae')||'{}'); }catch(e){ return {}; } }
function save(){ stamp(); try{ localStorage.setItem('jiugae',JSON.stringify(S)); }catch(e){} }
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysLeft(){ return Math.max(0,Math.ceil((EXAM_DATE-new Date())/86400000)); }
function normalize(){
  S.cards=S.cards||{};      // id -> {st:0새/1학습/2지움, k:근거까지 안 날짜들[], last:날짜, due:날짜, miss:틀린 수, seen:본 수}
  S.log=S.log||[];          // {d,subj,ok,id,ts:시각,v:기기}
  S.exam=S.exam||{};        // round -> {answers:{}, score, date}
  S.minutes=S.minutes||60;
  S.daily=S.daily||{};      // 이 기기의 date -> {new:0, rev:0, sec:0}
  S.confused=S.confused||{}; // id -> 처음 누른 날짜(이해 안 된 카드)
  S.book=S.book||{read:{},last:'',hide:false,subj:'civ'}; S.book.read=S.book.read||{};
  S.pat=S.pat||{};          // 패턴 id -> 외웠다 누른 날짜
  S.rep=S.rep||{};          // 또 나온 문장 ref -> {n:본 수, ok:맞힌 수, l:마지막 1맞음/0틀림, d:날짜}
  S.ddo=S.ddo||{};          // 다른 기기의 daily (동기화로 받음)
  S._epoch=S._epoch||0;     // '처음부터'·붙여넣어 불러오기를 누른 시각
  if(!S._ts) S._ts=legacyTs(); // 동기화 단위 -> 바뀐 시각
  S.log.forEach((l,i)=>{ if(!l.ts){ l.ts=dayMs(l.d)+i; l.v=DEV; } });
}

/* ===== 기기 간 동기화 =====
   기록을 단위(카드 한 장, 실전 한 번, 개념서 섹션 하나, 설정 하나)로 나눠 바뀐 시각을 S._ts에 적고,
   기기끼리 합칠 때 단위마다 더 늦게 바뀐 쪽을 쓴다. 하루 공부량은 기기마다 따로 쌓아 더하고, 판단 기록은 합집합.
   저장소는 PD의 GitHub 비공개 gist(jiugae-sync.json). 토큰은 기록과 따로 이 기기에만 둔다(설정의 복사 글에 안 섞이게). */
const DEV=(()=>{ try{ let d=localStorage.getItem('jiugae-dev'); if(!d){ d=Math.random().toString(36).slice(2,10); localStorage.setItem('jiugae-dev',d); } return d; }catch(e){ return 'tmp'; } })();
const NOTUNIT=['cards','exam','confused','book','pat','rep','log','daily','ddo','dataver','notice','_ts','_epoch'];
const UNIT_DEF={'p/minutes':'60','b/last':'""','b/hide':'false','b/subj':'"civ"'}; // 처음 값은 다른 기기 값에 진다
let SNAP=null; // 지난 save() 때의 단위들
function dayMs(d){ const x=Date.parse((d||'')+'T00:00:00+09:00'); return isNaN(x)?1:x; }
function blankCard(s){ return !s||(!s.st&&!s.seen&&!s.miss&&!s.last&&!(s.k&&s.k.length)); }
function units(st){
  const u={}, J=JSON.stringify;
  for(const [k,v] of Object.entries(st.cards||{})) if(!blankCard(v)) u['c/'+k]=J(v);
  for(const [k,v] of Object.entries(st.exam||{})) u['x/'+k]=J(v);
  for(const [k,v] of Object.entries(st.confused||{})) u['f/'+k]=J(v);
  for(const [k,v] of Object.entries(st.book||{})){ if(k==='read'){ for(const [i,d] of Object.entries(v||{})) u['r/'+i]=J(d); } else u['b/'+k]=J(v); }
  for(const [k,v] of Object.entries(st.pat||{})) u['t/'+k]=J(v);
  for(const [k,v] of Object.entries(st.rep||{})) u['e/'+k]=J(v);
  for(const [k,v] of Object.entries(st)) if(!NOTUNIT.includes(k)) u['p/'+k]=J(v);
  return u;
}
function setUnit(key,json){
  const p=key[0], k=key.slice(2);
  const o=p==='c'?S.cards:p==='x'?S.exam:p==='f'?S.confused:p==='r'?S.book.read:p==='b'?S.book:p==='t'?S.pat:p==='e'?S.rep:S;
  if(json===undefined) delete o[k]; else o[k]=JSON.parse(json);
}
// 동기화 전부터 있던 기록: 카드는 마지막 본 날짜(같은 날이면 본 수), 나머지는 적힌 날짜로 시각을 매긴다
function legacyTs(){
  const ts={};
  for(const [key,j] of Object.entries(units(S))){
    const v=JSON.parse(j), p=key[0];
    ts[key]=p==='c'?(v.last?dayMs(v.last)+Math.min(v.seen||0,999):1)
      :p==='x'?(v&&v.date?dayMs(v.date):1)
      :(p==='f'||p==='r'||p==='t')&&typeof v==='string'?dayMs(v)
      :p==='e'&&v&&v.d?dayMs(v.d)+Math.min(v.n||0,999)
      :UNIT_DEF[key]===j?0:1;
  }
  return ts;
}
// save() 때마다 지난 저장과 비교해 바뀐 단위에 지금 시각을 찍고, 새 판단 기록에 시각·기기를 붙인다
function stamp(){
  if(!SNAP) return;
  const now=Date.now(), cur=units(S);
  for(const k in cur) if(cur[k]!==SNAP[k]) S._ts[k]=now;
  for(const k in SNAP) if(!(k in cur)) S._ts[k]=now;
  let i=S.log.length; while(i>0&&!S.log[i-1].ts) i--;
  for(let n=now;i<S.log.length;i++,n++){ S.log[i].ts=n; S.log[i].v=DEV; }
  SNAP=cur; markDirty();
}
function allDaily(){
  const o={};
  for(const m of [S.daily,...Object.values(S.ddo)]) for(const [d,v] of Object.entries(m||{})){ const w=o[d]||(o[d]={new:0,rev:0,sec:0}); w.new+=v.new||0; w.rev+=v.rev||0; w.sec+=v.sec||0; }
  return o;
}
function maxDaily(a,b){
  const o=Object.assign({},a);
  for(const [d,v] of Object.entries(b||{})){ const w=o[d]||{}; o[d]={new:Math.max(w.new||0,v.new||0),rev:Math.max(w.rev||0,v.rev||0),sec:Math.max(w.sec||0,v.sec||0)}; }
  return o;
}
// 원격 기록 R을 S에 합친다. 바뀐 것이 있으면 true
function mergeRemote(R){
  const re=R.epoch||0;
  if(re<S._epoch) return false; // 이 기기에서 '처음부터'·불러오기를 더 늦게 눌렀다: 원격은 덮어쓴다
  if(re>S._epoch){              // 다른 기기에서 눌렀다: 그 기록을 통째로 받는다
    const dv=S.dataver, dd=R.dd||{};
    S=Object.assign({},R.s,{dataver:dv,_epoch:re,_ts:Object.assign({},R.ts),log:R.log||[],daily:dd[DEV]||{},ddo:{}});
    for(const [d,m] of Object.entries(dd)) if(d!==DEV) S.ddo[d]=m;
    normalize(); SNAP=units(S); return true;
  }
  let ch=false; const lu=units(S), ru=units(R.s||{}), rt=R.ts||{};
  for(const key in rt){
    if(rt[key]>(S._ts[key]||0)){ if(ru[key]!==lu[key]){ setUnit(key,ru[key]); ch=true; } S._ts[key]=rt[key]; }
  }
  for(const [d,m] of Object.entries(R.dd||{})){
    if(d===DEV) continue;
    const b=JSON.stringify(S.ddo[d]||{}); S.ddo[d]=maxDaily(S.ddo[d],m); if(JSON.stringify(S.ddo[d])!==b) ch=true;
  }
  const have=new Set(S.log.map(l=>l.v+'|'+l.ts)); let add=0;
  for(const l of R.log||[]) if(l.ts&&!have.has(l.v+'|'+l.ts)){ S.log.push(l); add++; }
  if(add){ S.log.sort((a,b)=>a.ts-b.ts); if(S.log.length>3000) S.log=S.log.slice(-3000); ch=true; }
  SNAP=units(S);
  return ch;
}
// 합친 뒤에도 원격에 없는 것이 이 기기에 남았나(그러면 올린다)
function localAhead(R){
  if((R.epoch||0)!==S._epoch) return true;
  const rt=R.ts||{}; for(const k in S._ts) if(S._ts[k]>(rt[k]||0)) return true;
  const rk=new Set((R.log||[]).map(l=>l.v+'|'+l.ts)); if(S.log.slice(-LOGN).some(l=>!rk.has(l.v+'|'+l.ts))) return true;
  const dd=R.dd||{}; if(JSON.stringify(S.daily)!==JSON.stringify(dd[DEV]||{})) return true;
  for(const [d,m] of Object.entries(S.ddo)) for(const [day,v] of Object.entries(m)){ const w=(dd[d]||{})[day]; if(!w||w.new<v.new||w.rev<v.rev||w.sec<v.sec) return true; }
  return false;
}
let SY=(()=>{ try{ return JSON.parse(localStorage.getItem('jiugae-sync')||'{}'); }catch(e){ return {}; } })(); // {token, gist, last, err}
function saveSY(){ try{ localStorage.setItem('jiugae-sync',JSON.stringify({token:SY.token,gist:SY.gist,last:SY.last,err:SY.err})); }catch(e){} }
const GH='https://api.github.com', SFILE='jiugae-sync.json', LOGN=1000; // 판단 기록은 최근 1000개만 오간다(정확도는 과목별 최근 120개로 계산)
let lastTag='', lastText=''; // 마지막으로 받거나 올린 gist의 ETag·내용: 안 바뀌었으면 다시 받지 않는다
async function gh(path,opt){
  opt=opt||{};
  const r=await fetch(GH+path,{method:opt.method||'GET',cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'},opt.body?{'Content-Type':'application/json'}:{},opt.headers||{}),
    body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok&&r.status!==304){ const e=new Error('GitHub '+r.status); e.status=r.status; throw e; }
  return r;
}
async function ghFind(){
  for(let p=1;p<=5;p++){ const L=await (await gh(`/gists?per_page=100&page=${p}`)).json(); const g=L.find(g=>g.files&&g.files[SFILE]); if(g) return g.id; if(L.length<100) break; }
  return null;
}
async function ghRead(id){
  const r=await gh('/gists/'+id,{headers:lastTag&&lastText?{'If-None-Match':lastTag}:{}});
  if(r.status!==304){
    const g=await r.json(), f=g.files&&g.files[SFILE]; if(!f) return null;
    lastText=f.truncated?await fetch(f.raw_url,{cache:'no-store'}).then(x=>x.text()):f.content; lastTag=r.headers.get('ETag')||'';
  }
  return JSON.parse(lastText);
}
async function ghWrite(id,text){
  const r=await gh(id?'/gists/'+id:'/gists',{method:id?'PATCH':'POST',body:id?{files:{[SFILE]:{content:text}}}:{description:'기출 지우개 공부 기록 (동기화용, 지우지 마세요)',public:false,files:{[SFILE]:{content:text}}}});
  const g=await r.json(); lastText=text; lastTag=r.headers.get('ETag')||''; return g.id;
}
function payload(){
  const s={};
  for(const [k,v] of Object.entries(S)) if(!['log','daily','ddo','dataver','notice','_ts','_epoch'].includes(k)) s[k]=v;
  s.cards={}; for(const [k,v] of Object.entries(S.cards)) if(!blankCard(v)) s.cards[k]=v;
  return JSON.stringify({app:'jiugae',v:1,at:Date.now(),from:DEV,epoch:S._epoch,s,ts:S._ts,log:S.log.slice(-LOGN),dd:Object.assign({},S.ddo,{[DEV]:S.daily})});
}
let syncP=null, syncAgain=false, dirtyT=null;
function markDirty(){ if(!SY.token||dirtyT) return; dirtyT=setTimeout(()=>{ dirtyT=null; syncNow(); },120000); }
// 받아서 합치고, 이 기기에만 있는 게 있으면 올린다
function syncNow(){
  if(!SY.token||!D) return Promise.resolve();
  if(syncP){ syncAgain=true; return syncP; }
  clearTimeout(dirtyT); dirtyT=null; SY.busy=true; syncUI();
  syncP=(async()=>{
    if(!SY.gist){ SY.gist=await ghFind(); lastTag=lastText=''; }
    let R=null;
    if(SY.gist){ try{ R=await ghRead(SY.gist); }catch(e){ if(e.status!==404) throw e; SY.gist=null; lastTag=lastText=''; } }
    const ch=R&&R.app==='jiugae'?mergeRemote(R):false;
    if(ch){ try{ localStorage.setItem('jiugae',JSON.stringify(S)); }catch(e){} }
    if(!SY.gist) SY.gist=await ghWrite(null,payload());
    else if(!R||localAhead(R)) await ghWrite(SY.gist,payload());
    SY.last=Date.now(); SY.err='';
    if(ch) afterMerge();
  })().catch(e=>{
    SY.err=e.status===401?'토큰이 틀렸거나 만료됐습니다. 새 토큰으로 다시 연결하세요.'
      :e.status===403||e.status===404?`GitHub가 거절했습니다(${e.status}). 토큰에 gist 권한이 있는지 확인하세요.`
      :e.status===429?'GitHub가 잠시 막았습니다. 조금 뒤 저절로 다시 합니다.'
      :e.status?'GitHub 오류 '+e.status:'인터넷이 안 됩니다. 연결되면 저절로 맞춥니다.';
  }).finally(()=>{ SY.busy=false; saveSY(); syncP=null; syncUI(); if(syncAgain){ syncAgain=false; markDirty(); } });
  return syncP;
}
function afterMerge(){ migrate(); if((view==='today'&&!session)||view==='stats'||view==='settings') render(); else header(); }
function syncWhen(){ const t=new Date(SY.last); return (t.toDateString()===new Date().toDateString()?'오늘 ':`${t.getMonth()+1}/${t.getDate()} `)+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }
function syncStatus(){ return SY.busy?'맞추는 중…':SY.err?`<span style="color:var(--x)">${esc(SY.err)}</span>`:SY.last?'마지막 동기화 '+syncWhen():'아직 안 맞춤'; }
function syncUI(){
  const el=document.getElementById('syncdot');
  if(el){ el.textContent=!SY.token?'':SY.busy?' · ⟳':SY.err?' · ☁!':' · ☁'; el.className=SY.err?'err':''; el.title=SY.token?syncStatus().replace(/<[^>]+>/g,''):''; }
  const st=document.getElementById('syncst'); if(st) st.innerHTML=syncStatus();
}
document.getElementById('syncdot').onclick=()=>{ if(SY.token) goView('settings'); };
document.addEventListener('visibilitychange',()=>{
  if(!SY.token||!D) return;
  if(document.visibilityState==='hidden'){ if(dirtyT) syncNow(); }       // 다른 앱·기기로 넘어가기 전에 올린다
  else if(Date.now()-(SY.last||0)>15000) syncNow();                         // 돌아오면 다른 기기 기록을 받는다
});
window.addEventListener('online',()=>{ if(SY.token&&D) syncNow(); });
normalize(); SNAP=units(S);

function cardState(id){ return S.cards[id]||(S.cards[id]={st:0,k:[],last:'',due:'',miss:0,seen:0}); }

/* ===== 큐 만들기 ===== */
function buildQueue(){
  const t=today(); const d=S.daily[t]||(S.daily[t]={new:0,rev:0,sec:0});
  const review=[], fresh=[], audit=[];
  for(const c of D.cards){
    const s=cardState(c.id);
    if(s.st===2){ audit.push(c); continue; }
    if(s.st===1){ if(s.due<=t) review.push(c); }
    else fresh.push(c);
  }
  // 복습: 틀린 수 많은 것 먼저
  review.sort((a,b)=>cardState(b.id).miss-cardState(a.id).miss);
  // 지운 카드 몰래 검사: 하루 3장
  shuffle(audit); const auditPick=audit.slice(0,3);
  // 분량: 60분이면 복습 최대 45 + 새 카드 35 정도. 시간에 비례
  const m=S.minutes; const revN=Math.round(m*0.7), newN=Math.round(m*1.0);
  const q=[...review.slice(0,revN), ...fresh.slice(0,newN)];
  // 검사 카드는 중간중간 끼움
  auditPick.forEach((c,i)=>q.splice(Math.min(q.length, 5+i*8),0,c));
  return {q, review:review.length, fresh:fresh.length, deleted:audit.length};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

/* ===== 화면 공통 ===== */
const main=document.getElementById('main');
let view='today', session=null;
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='book'&&view==='book'){ bk.sec=null; bk.memo=false; bk.from=null; } view=b.dataset.v; document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
function goView(v){ view=v; document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===v)); render(); }
function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
// 해설 글: **개념어** 굵게, ⟪결론⟫ 형광 밑줄(표시는 앱/강조.py가 넣는다). 조문·판례 번호는 작은 회색으로 물린다.
const LREF=String.raw`(?:[가-힣]{1,15}법\s*)?제?\d{1,4}조(?:의\s?\d+)?(?!\s*원)(?:\s*제?\d+항)?(?:\s*제?\d+호)?(?:\s*(?:본문|단서|전단|후단))?(?:\s*준용)?`;
const LCASE=String.raw`대판\s*\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.?\s*\d{2,4}[가-힣]{1,3}\d+(?:\s*전원합의체)?`;
const LAWRE=new RegExp(String.raw`\((?:\s*(?:${LREF}|${LCASE}|판례|전원합의체)\s*[,·/]?)+\)|${LREF}|${LCASE}`,'g');
function md(t){ return esc(t).replace(LAWRE,'<span class="lw">$&</span>').replace(/\*\*(.+?)\*\*/g,'<b class="kw">$1</b>').replace(/⟪(.+?)⟫/g,'<span class="cc">$1</span>'); }
function plain(t){ return (t||'').replace(/\*\*|[⟪⟫]/g,''); }

// 회독: n회독 = 지우지 않은 카드를 전부 n번 이상 본 상태. 지운 카드는 어느 회독에서나 끝난 것으로 친다.
// 지금 회독 = 지우지 않은 카드 중 가장 적게 본 횟수 + 1
function passInfo(){
  const total=D.cards.length, seen=[], byG={}; let del=0;
  for(const c of D.cards){
    const s=S.cards[c.id], g=D.questions[c.q].grade, G=byG[g]||(byG[g]={t:0,del:0,seen:[]}); G.t++;
    if(s&&s.st===2){ del++; G.del++; } else { const n=s?s.seen||0:0; seen.push(n); G.seen.push(n); }
  }
  const live=seen.length, pass=live?Math.min(...seen)+1:0;
  const doneAt=k=>seen.filter(x=>x>=k).length, done=live?doneAt(pass):0;
  return {total, del, live, pass, done, pct:100*(del+done)/total, at:k=>100*(del+doneAt(k))/total, byG};
}
function pct(x){ return (x>0&&x<1?x.toFixed(1):Math.floor(x))+'%'; }

// 오늘 탭 '전체 진도': 몇 회독째인지, 그 회독이 몇 % 됐는지
function progressHtml(p){
  if(!p.live) return `<div class="card prog"><div class="big">✂ 전부 지웠습니다</div><p class="muted" style="margin:6px 0 0">지운 카드 검사만 하루 3장씩 나옵니다.</p></div>`;
  const w=x=>(100*x/p.total).toFixed(2)+'%', left=p.live-p.done;
  // 회독 칸: 지금 회독과 그다음 두 회독. 끝낸 회독은 빼고, 회독이 넘어가면 칸이 한 칸씩 밀린다(4·5·6회독 → 5·6·7회독)
  const chips=[p.pass,p.pass+1,p.pass+2].map(k=>`<span class="${k===p.pass?'on':''}">${k}회독 ${pct(p.at(k))}</span>`).join('');
  const gr=['A','B','C'].filter(g=>p.byG[g]).map(g=>{ const G=p.byG[g]; return `${g}급 ${pct(100*(G.del+G.seen.filter(x=>x>=p.pass).length)/G.t)}`; }).join(' · ');
  return `<div class="card prog">
    <div class="hd"><span class="ps">전체 진도</span><span class="muted" style="font-size:12px">카드 ${p.total.toLocaleString()}장</span></div>
    <div class="big">${p.pass}회독째 ${pct(p.pct)}</div>
    <div class="sbar"><i class="d" style="width:${w(p.del)}"></i><i class="s" style="width:${w(p.done)}"></i></div>
    <div class="leg"><span class="d">지움 ${p.del}</span><span class="s">${p.pass===1?'본 카드':p.pass+'번 본 카드'} ${p.done}</span><span>${p.pass===1?'안 본 카드':'아직'} ${left}</span></div>
    <div class="passes">${chips}</div>
    <div class="gr">${gr}${p.pass===1?' (새 카드는 A급부터)':''}</div>
    ${paceHtml(p)}
  </div>`;
}
function mdw(d){ const x=new Date(d+'T00:00:00'); return `${x.getMonth()+1}/${x.getDate()}(${'일월화수목금토'[x.getDay()]})`; }
// 지금 속도로 1회독이 언제 끝나나. 새 카드는 '시작' 한 번에 하루 시간(분)만큼 나온다
function paceHtml(p){
  const t=today(), lastDay=addDays(EXAM_DAY,-1);
  if(p.pass>1) return `<div class="pace">${p.pass}회독은 복습 카드로 저절로 채워집니다. 지우지 않은 ${p.live}장 중 ${p.live-p.done}장 남았습니다.</div>`;
  if(t>lastDay) return '';
  const per=Math.round(S.minutes*1.0), todayLeft=Math.max(0,per-((allDaily()[t]||{}).new||0));
  const fin=rem=>rem<=todayLeft?t:addDays(t,Math.ceil((rem-todayLeft)/per));
  const remAll=p.live-p.done, A=p.byG.A, remA=A?A.seen.filter(x=>x<1).length:0, endAll=fin(remAll);
  if(endAll<=lastDay) return `<div class="pace">하루 새 카드 ${per}장이면 <b>${mdw(endAll)}</b>에 1회독 끝 · 시험 전 ✓</div>`;
  const days=dayDiff(t,lastDay)+(todayLeft>0?1:0), need=Math.ceil(remAll/Math.max(1,days)), endA=fin(remA);
  return `<div class="pace">하루 새 카드 ${per}장이면 1회독 끝 → ${remA?`A급 <b>${mdw(endA)}</b>${endA<=lastDay?' ✓':''}`:'A급 ✓'} · 전체 <b>${mdw(endAll)}</b>
    <div class="muted" style="font-size:12.5px;margin-top:2px">시험(${mdw(EXAM_DAY)}) 전에 다 보려면 하루 ${need}장. 오늘 분량 뒤 '시작'을 또 누르면 새 카드 ${per}장이 더 나옵니다.</div></div>`;
}
// 카드에서 많이 틀린 논점을 개념서 섹션으로 묶어 보여 준다
function weakHtml(){
  if(!B||!D) return '';
  const byQ={}; for(const c of D.cards){ const st=S.cards[c.id]; if(st&&st.miss>0&&st.st!==2) byQ[c.q]=(byQ[c.q]||0)+1; }
  if(!Object.keys(byQ).length) return `<div class="card"><b>개념서</b><p class="muted" style="margin:4px 0 8px">카드를 넘기다 틀린 논점이 생기면 여기에 그 논점의 개념서 섹션이 뜹니다.</p><button class="bookbtn" style="margin-top:0" id="toBook">📖 개념서 목차 열기</button></div>`;
  const rows=Object.values(B.sections).map(s=>({s,n:s.refs.reduce((a,q)=>a+(byQ[q]||0),0)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||b.s.f10-a.s.f10).slice(0,3);
  return `<div class="card"><b>틀린 카드가 많은 논점</b><p class="muted" style="margin:4px 0 0">카드만 넘기지 말고 개념서로 한 번 읽어 두세요.</p>${rows.map(x=>`<button class="bookbtn" data-book="${x.s.id}">📖 ${esc(x.s.title)} <span style="font-weight:600">· 틀린 카드 ${x.n}장</span></button>`).join('')}</div>`;
}
function accuracy(){
  const res={};
  for(const subj of ['rea','civ']){
    const L=S.log.filter(l=>l.subj===subj).slice(-120);
    const n=L.length, ok=L.filter(l=>l.ok).length;
    // 찍기 보정: 정확도 p → 5지선다 기대 정답률 대략 p^(1.6) (선지 4~5개를 다 맞혀야 한 문항이 맞는다는 보수적 보정)
    const p=n?ok/n:0; const expected=n?Math.round(Math.pow(p,1.6)*100):0;
    res[subj]={n, acc:Math.round(p*100), score:n?expected:'-'};
  }
  res.avg=(res.rea.n&&res.civ.n)?Math.round((res.rea.score+res.civ.score)/2):'-';
  return res;
}

let timerId=null, startAt=0;

}
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function endSession(){
  if(session){ const t=today(); const d=S.daily[t]||(S.daily[t]={new:0,rev:0,sec:0}); d.sec+=Math.floor((Date.now()-session.startAt)/1000); save(); }
  session=null; clearInterval(timerId); render();
}
function markChoice(text, wrong){
  if(!wrong||!text.includes(wrong)) return esc(text);
  const i=text.indexOf(wrong);

}

function renderMarked(c){

  if(c.key&&t.includes(c.key)){ const p=t.indexOf(c.key); return esc(t.slice(0,p))+'<span class="hl">'+esc(c.key)+'</span>'+esc(t.slice(p+c.key.length)); }
  return markChoice(t,c.wrong);
}
// 앞면 회색 음영: 해설이 칠하는 자리(바꿔친 말 또는 형광펜)를 어절 단위로 넓히고 8글자 이상으로 맞춘다.
// 바꿔친 말은 형광펜보다 짧아서 그대로 칠하면 칠한 길이로 O/X가 티 난다.
// 예/아니오 카드는 보기가 대개 한두 낱말이라 칠하는지 여부로 답이 기운다. 옳은 말 카드에만 쓴다.
function focusRange(c){
  const t=c.text||''; let a, b;
  if(c.swap&&c.swap.pos>=0){ a=c.swap.pos; b=a+c.swap.from.length; }
  else if(c.key&&t.includes(c.key)){ a=t.indexOf(c.key); b=a+c.key.length; }
  else return null;
  const sp=ch=>/\s/.test(ch), P='.,?!·)';
  while(a>0&&!sp(t[a-1])) a--;
  while(b<t.length&&!sp(t[b])) b++;
  while(b>a&&P.includes(t[b-1])) b--;
  const vis=()=>t.slice(a,b).replace(/\s/g,'').length;
  while(vis()<8){
    const a0=a, b0=b;
    if(a>0){ let j=a-1; while(j>0&&sp(t[j-1])) j--; while(j>0&&!sp(t[j-1])) j--; a=j; }
    else if(b<t.length){ let j=b; while(j<t.length&&sp(t[j])) j++; while(j<t.length&&!sp(t[j])) j++; b=j; while(b>a&&P.includes(t[b-1])) b--; }
    if(a===a0&&b===b0) break;
  }
  if(a===0&&!t.slice(b).replace(/[\s.,?!·)]/g,'')) return null; // 문장 전체면 칠할 뜻이 없다
  return [a,b];
}
function shadeFocus(c){
  const t=c.text||'', r=focusRange(c);
  if(!r) return esc(t);
  return esc(t.slice(0,r[0]))+'<span class="focus">'+esc(t.slice(r[0],r[1]))+'</span>'+esc(t.slice(r[1]));
}
function fixedText(c){ const t=c.text, p=c.swap.pos; return t.slice(0,p)+c.swap.to+t.slice(p+c.swap.from.length); }
function ansLabel(c){
  if(c.mode==='calc'||c.mode==='choose') return c.ox;
  if(c.mode==='member') return c.ox==='Y'?'예':'아니오';
  return c.ox==='O'?'O 옳은 말':'X 틀린 말';
}
function askText(c,Q){
  const pas=(Q.passage||[]).join(' / ').slice(0,1200);
  return `공인중개사 1차 기출을 공부하는데 아래 해설을 봐도 이해가 안 돼.\n중학생도 알아듣게 쉬운 말과 생활 예시로 5줄 안에 설명해 줘. 법률 용어는 괄호로 풀어 줘. 마지막 줄에 외울 한 문장을 줘.\n\n[문제] 제${Q.round}회 ${Q.no}번 ${Q.question}\n${pas?'[조건·보기] '+pas+'\n':''}[카드] ${c.n} ${c.mode==='calc'?'':c.text}\n[정답] ${ansLabel(c)}\n[해설] ${plain(c.reason)}${c.law?'\n[근거] '+c.law:''}${Q.calc?'\n[풀이] '+Q.calc:''}`;
}

function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>alert('복사했습니다. Claude 앱에 붙여 넣으세요.'),()=>fallbackCopy(t)); }catch(e){ fallbackCopy(t); } }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); alert('복사했습니다'); }catch(e){ prompt('아래 글을 길게 눌러 복사하세요', t); } ta.remove(); }
// 지우기 규칙: 서로 다른 날 연속으로 맞히면 저절로 지운다. 한 번이라도 틀리면 0부터.
// STREAK_GAP[n] = n번째까지 센 뒤 며칠 지나야 다음 정답을 세나. 첫 번째는 언제든, 두 번째는 하루 뒤, 세 번째는 이틀 뒤부터.
// OX 카드를 찍어서 3번 연속 맞힐 확률은 1/8이고, 지운 카드는 하루 3장씩 몰래 다시 나와 틀리면 되살아난다.
const STREAK_GAP=[0,1,2], STREAK_N=STREAK_GAP.length;
// 카드 판정. 돌려주는 값은 뒷면에 띄울 연속 기록 결과: {r:'del'|'up'|'wait'|'miss'|'audit'|'revive', n:지금 연속, prev:틀리기 전 연속, gap:더 기다릴 날}
function judge(c, ok){
  const Q=D.questions[c.q], st=cardState(c.id), t=today(); const d=S.daily[t]||(S.daily[t]={new:0,rev:0,sec:0});
  S.log.push({d:t, subj:Q.subject, ok, id:c.id}); if(S.log.length>3000) S.log=S.log.slice(-3000);
  if(st.st===0){ d.new++; } else { d.rev++; }
  st.seen++; st.last=t; st.a=c.mode+':'+c.ox;
  const prev=st.k.length; let res;
  if(!ok){
    st.miss++; st.k=[]; st.due=t; // 틀리면 오늘 다시(큐가 끝나면 내일)
    res={r:st.st===2?'revive':'miss', n:0, prev};
    st.st=1;                        // 지운 카드 검사에서 틀리면 되살림
  } else if(st.st===2){
    res={r:'audit', n:prev};
  } else {
    st.st=1;
    const need=STREAK_GAP[Math.min(prev,STREAK_N-1)], gone=prev?dayDiff(st.k[prev-1],t):0;
    if(!prev||gone>=need){
      st.k.push(t);
      if(st.k.length>=STREAK_N){ st.st=2; res={r:'del', n:st.k.length}; }
      else { st.due=addDays(t,STREAK_GAP[st.k.length]); res={r:'up', n:st.k.length}; }
    } else {
      if(!(st.due>t)) st.due=addDays(t,1);
      res={r:'wait', n:prev, gap:need-gone};
    }
    if(S.confused[c.id]&&S.confused[c.id]<t) delete S.confused[c.id]; // 이해 안 됐던 카드를 다른 날 맞히면 목록에서 뺀다
  }
  save();
  return res;
}
function afterCard(c, r){
  const st=cardState(c.id), t=today();
  if(r==='cf'){ st.k=[]; st.st=1; st.due=addDays(t,1); } // 이해 안 됨: 연속 기록을 지우고, 방금 지워졌어도 되살린다
  if(r==='del'){ st.st=2; }
  save();
}
function addDays(d,n){ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000); }
function dots(n){ n=Math.min(n,STREAK_N); return '●'.repeat(n)+'○'.repeat(STREAK_N-n); }
function streakHtml(res){
  if(!res) return '';
  const N=STREAK_N, when=g=>g<=1?'내일':g===2?'모레':`${g}일 뒤`;
  const m={
    del:['ok',`✂ 지웠습니다 · 서로 다른 날 ${N}번 연속 맞힘`],
    up:['up',`지우기까지 ${dots(res.n)} ${res.n}/${N} · ${when(STREAK_GAP[res.n])}부터 또 맞히면 ${res.n+1===N?'저절로 지워집니다':`${res.n+1}/${N}`}`],
    wait:['',`지우기까지 ${dots(res.n)} ${res.n}/${N} · 이번 건 안 셉니다(${when(res.gap)}부터 셉니다)`],
    miss:['bad',res.prev?`연속 ${res.prev}번이 끊겼습니다 · 0/${N}부터 다시`:`지우기까지 ${dots(0)} 0/${N} · 다시 나옵니다`],
    audit:['ok','지운 카드 검사 통과 · 그대로 지워 둡니다'],
    revive:['bad','지운 카드였는데 틀려서 되살렸습니다 · 0/'+N+'부터 다시'],
  }[res.r];
  return `<div class="streak ${m[0]}">${m[1]}</div>`;
}

function gradeExam(){

/* ===== 개념서 ===== */
let B=null, bookLoading=null, Q2S={};
const bk={sec:null, from:null, q:'', memo:false, open:{}, tocY:0, wrong:false};
function bookState(){ return S.book||(S.book={read:{},last:'',hide:false,subj:'civ'}); }
function loadBook(){
  if(B) return Promise.resolve(B);
  if(!bookLoading) bookLoading=fetch('book.json?v='+Date.now()).then(r=>r.json()).then(d=>{ B=d; Q2S={}; for(const s of Object.values(B.sections)) for(const q of s.refs) (Q2S[q]=Q2S[q]||[]).push(s.id); return B; }).catch(e=>{ bookLoading=null; throw e; });
  return bookLoading;
}
function rlabel(ref){ const p=ref.split('-'); return `${p[0]}회 ${p[1]}번`; }
function subjSecs(subj){ const out=[]; for(const cid of B.subjects.find(x=>x.id===subj).chapters) out.push(...B.chapters[cid].sections); return out; }
function freqLabel(s){ return `10년 ${s.f10}회${s.f5?` · 최근5년 ${s.f5}`:''}`; }
function bookLinks(qid){
  if(!B||!Q2S[qid]) return '';
  return Q2S[qid].slice(0,2).map(id=>`<button class="bookbtn" data-book="${id}">📖 개념서에서 읽기 · ${esc(B.sections[id].title)}</button>`).join('');
}
function renderBook(){
  if(!B){
    main.innerHTML='<div class="card muted">개념서 불러오는 중…</div>';
    loadBook().then(()=>{ if(view==='book') renderBook(); }).catch(()=>{ if(view==='book') main.innerHTML='<div class="card">개념서(book.json)를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>'; });
    return;
  }
  if(bk.sec&&B.sections[bk.sec]) return renderSection(bk.sec);
  if(bk.memo) return renderMemos();
  renderToc();
}
function chapterRead(cid){ const R=bookState().read; return B.chapters[cid].sections.filter(id=>R[id]).length; }
function renderToc(){
  const st=bookState(); const subj=st.subj||'civ'; const sb=B.subjects.find(x=>x.id===subj);
  const last=st.last&&B.sections[st.last];
  const secs=subjSecs(subj); const nRead=secs.filter(id=>st.read[id]).length;
  let html=`<div class="seg">${B.subjects.map(x=>`<button data-subj="${x.id}" class="${x.id===subj?'on':''}">${x.id==='civ'?'민법':'학개론'}</button>`).join('')}</div>
  <input class="search" id="bks" type="search" placeholder="개념서 검색 (예: 유치권, 저당상수)" value="${esc(bk.q)}">
  ${last&&!bk.q?`<button class="cont" data-sec="${last.id}"><span>이어 읽기</span>${esc(last.title)}</button>`:''}
  <div class="row" style="margin:0 2px 10px"><span class="muted">${sb.name} · 읽은 섹션 ${nRead}/${secs.length}</span><button class="linkbtn" id="memo">외우기 모음 ›</button></div>`;
  if(bk.q.trim()) html+=searchResults(bk.q.trim());
  else {
    for(const cid of sb.chapters){
      const ch=B.chapters[cid]; const r=chapterRead(cid), n=ch.sections.length; const open=bk.open[cid];
      html+=`<div class="card chap"><button class="hd" data-ch="${cid}"><div class="row"><b>${esc(ch.title)}</b><span class="muted" style="font-size:13px">${open?'접기':'펼치기'}</span></div>
        <div class="meta">10년 ${ch.nq}문항 출제(한 해 약 ${ch.per_round}문항) · 섹션 ${n}개 · 읽음 ${r}/${n}</div><div class="pbar"><i style="width:${n?Math.round(100*r/n):0}%"></i></div></button>
        ${open?`<div class="secs">${ch.intro?`<div class="intro">${md(ch.intro)}</div>`:''}${(ch.tables||[]).map(tableHtml).join('')}${ch.sections.map(id=>{ const s=B.sections[id]; return `<button class="srow ${st.read[id]?'read':''}" data-sec="${id}"><span class="ck">${st.read[id]?'✓':''}</span><span class="tag ${s.grade}">${s.grade}</span><span class="t">${esc(s.title)}</span><span class="f">${s.f10}회</span></button>`; }).join('')}</div>`:''}
      </div>`;
    }
    html+=`<p class="muted" style="font-size:12px;margin:4px 2px 0">A = 10년 중 6개 회차 이상 출제(꼭 읽기), B = 4~5회, C = 3회 이하. 오른쪽 숫자는 10년 중 출제 회차 수.</p>`;
  }
  main.innerHTML=html;
  main.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{ st.subj=b.dataset.subj; save(); renderToc(); });
  main.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ bk.open[b.dataset.ch]=!bk.open[b.dataset.ch]; const y=window.scrollY; renderToc(); window.scrollTo(0,y); });
  main.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ bk.tocY=window.scrollY; openSection(b.dataset.sec); });
  main.querySelector('#memo').onclick=()=>{ bk.tocY=window.scrollY; bk.memo=true; render(); };
  const inp=main.querySelector('#bks');
  inp.oninput=()=>{ bk.q=inp.value; clearTimeout(inp._t); inp._t=setTimeout(()=>{ renderToc(); const i2=main.querySelector('#bks'); i2.focus(); i2.setSelectionRange(i2.value.length,i2.value.length); },250); };
  if(bk.tocY){ const y=bk.tocY; bk.tocY=0; requestAnimationFrame(()=>window.scrollTo(0,y)); }
}
function openSection(id){ bk.sec=id; bk.memo=false; render(); }
function searchResults(q){
  const ql=q.toLowerCase(); const hits=[];
  const mark=t=>{ const i=t.toLowerCase().indexOf(ql); if(i<0) return null; const a=Math.max(0,i-24); return (a?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,i+q.length+40))+'…'; };
  for(const s of Object.values(B.sections)){
    const pool=[s.title,s.law||'',s.one||'',...(s.concept||[]),...(s.traps||[]),s.memo||'',...(s.tables||[]).flatMap(t=>[t.title||'',...(t.head||[]),...t.rows.flat()]),...(s.calc||[]).flatMap(c=>[c.name,c.formula]),...s.ox.flatMap(o=>[o.text,o.fix||'',o.why||''])].map(plain);
    let first=null, n=0; for(const t of pool){ if(t.toLowerCase().includes(ql)){ n++; if(!first) first=mark(t); } }
    if(n) hits.push({s,n,first,score:(s.title.toLowerCase().includes(ql)?1000:0)+n});
  }
  hits.sort((a,b)=>b.score-a.score);
  if(!hits.length) return `<div class="card muted">'${esc(q)}'(이)가 들어간 섹션이 없습니다.</div>`;
  return `<div class="card" style="padding:6px 14px">${hits.slice(0,40).map(h=>`<button class="srow" data-sec="${h.s.id}"><span class="tag ${h.s.grade}">${h.s.grade}</span><span class="t">${esc(h.s.title)} <span class="muted" style="font-size:12px">${h.s.ch[0]==='C'?'민법':'학개론'} · ${h.n}곳</span><div class="hit">${h.first||''}</div></span></button>`).join('')}</div>`;
}
function tableHtml(t){
  return `<div class="tw"><table>${t.title?`<caption>${md(t.title)}</caption>`:''}${t.head&&t.head.length?`<thead><tr>${t.head.map(h=>`<th>${md(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
// 틀린 지문과 바로잡은 문장을 낱말 단위로 비교해 바뀐 곳만 표시
function wordDiff(a,b){
  const A=a.split(/(\s+)/).filter(x=>x!==''), Bw=b.split(/(\s+)/).filter(x=>x!=='');
  const n=A.length, m=Bw.length; if(n*m>40000) return null;
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=A[i]===Bw[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0, ra='', rb='';
  while(i<n||j<m){
    if(i<n&&j<m&&A[i]===Bw[j]){ ra+=esc(A[i]); rb+=esc(Bw[j]); i++; j++; }
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ rb+=/^\s+$/.test(Bw[j])?Bw[j]:'<ins>'+esc(Bw[j])+'</ins>'; j++; }
    else { ra+=/^\s+$/.test(A[i])?A[i]:'<del>'+esc(A[i])+'</del>'; i++; }
  }
  return {a:ra,b:rb};
}
function oxStatus(o){
  if(!o.c) return '';
  let del=0, miss=0, seen=0;
  for(const id of o.c){ const st=S.cards[id]; if(!st) continue; if(st.st===2) del++; miss+=st.miss||0; seen+=st.seen||0; }
  if(miss) return `<span class="dot miss">틀린 적 ${miss}</span>`;
  if(del&&del===o.c.length) return '<span class="dot del">지움</span>';
  if(seen) return '<span class="dot ok">맞힘</span>';
  return '';
}
// 甲·乙·丙 지문은 발문의 사실관계(사례)를 위에 붙인다. 바로 위 지문과 같은 사례면 한 번만

let P=null, patLoading=null, C2P={};

}

// 선지 읽는 법: 출제자가 틀린 선지를 만든 방식, 말버릇별 O/X 쏠림, 정답 번호 분포

function renderPatDetail(id){
  const p=patById(id), list=patsOf(p.subj), k=list.indexOf(p), prev=list[k-1], next=list[k+1], live=patLive(p);
  main.innerHTML=`<div class="reader">
    ${pt.from==='card'?`<div class="backbar"><button class="btn n small" id="backCard">← 카드로 돌아가기</button></div>`:''}
    <div class="row"><button class="linkbtn" id="toList">‹ 패턴 목록</button><span class="muted" style="font-size:12px">${SUBJ[p.subj]} ${k+1} / ${list.length}</span></div>
    <h2 class="st">${esc(p.title)}</h2>
    <div><span class="tag ${p.level}">${p.level}급</span><span class="tag">10년 ${p.f10}회 출제</span>${S.pat[id]?'<span class="tag" style="background:var(--o-bg);color:var(--o)">외움</span>':''}</div>
    <div class="pwhen"><small>이런 문제가 나오면</small>${md(p.when)}</div>
    <ul class="prule">${p.rule.map(r=>`<li>${md(r)}</li>`).join('')}</ul>
    ${p.table?tableHtml(p.table):''}
    ${p.exceptions&&p.exceptions.length?`<div class="pexc"><b>예외</b>${p.exceptions.map(md).join('<br>')}</div>`:''}
    <div class="sech"><h3>기출로 확인 ${p.ex.length}개</h3><button class="chipbtn ${pt.hide?'on':''}" id="hideAns">${pt.hide?'답 가림':'답 가리기'}</button></div>
    <p class="muted" style="font-size:12px;margin:0 0 2px">${pt.hide?'위 규칙으로 O/X를 먼저 정하고 지문을 눌러 확인하세요.':'빨간 줄은 출제자가 바꾼 말, 초록은 바로잡은 말.'}</p>
    <ul class="oxl ${pt.hide?'hideans':''}" id="oxl">${p.ex.map(patOxHtml).join('')}</ul>
    <div class="trapbox"><b>출제자가 바꾸는 자리</b>${md(p.trap)}</div>
    <div class="memo"><small>외우기</small>${md(p.memo)}</div>
    <div class="btns">${live.length?`<button class="btn n small" id="runCards">이 패턴 카드 ${live.length}장 돌리기</button>`:`<button class="btn ghost small" disabled>${p.cards.length?'이 패턴 카드는 다 지웠습니다':'카드는 32~36회만 있습니다'}</button>`}</div>
    <div class="btns" style="margin-top:8px"><button class="btn ${S.pat[id]?'ghost':'o'} small" id="doneBtn">${S.pat[id]?'외움 표시 지우기':'✓ 외웠다'}</button></div>
    <details style="margin-top:12px"><summary>개념서에서 더 읽기 (섹션 ${p.secs.length}개)</summary>${p.secs.map(s=>`<button class="bookbtn" data-book="${s.id}"><span class="tag ${s.grade}" style="font-size:11px">${s.grade}</span>${esc(s.title)} <span style="font-weight:600">· ${s.f10}회</span></button>`).join('')}</details>
    <div class="pn">${prev?`<button data-go="${prev.id}"><span>‹ 이전</span>${esc(prev.title)}</button>`:'<span style="flex:1"></span>'}${next?`<button class="nx" data-go="${next.id}"><span>다음 ›</span>${esc(next.title)}</button>`:'<span style="flex:1"></span>'}</div>
  </div>`;
  const bc=main.querySelector('#backCard'); if(bc) bc.onclick=()=>{ pt.from=null; pt.id=null; goView('today'); };
  main.querySelector('#toList').onclick=()=>{ pt.id=null; pt.from=null; pt.tab=p.subj; render(); };
  main.querySelector('#hideAns').onclick=()=>{ pt.hide=!pt.hide; keepY(()=>renderPatDetail(id)); };
  bindOx();
  const rc=main.querySelector('#runCards'); if(rc) rc.onclick=()=>{ pt.from=null; runCards(live); };
  main.querySelector('#doneBtn').onclick=()=>{ if(S.pat[id]) delete S.pat[id]; else S.pat[id]=today(); save(); keepY(()=>renderPatDetail(id)); };
  main.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{ bk.sec=b.dataset.book; bk.memo=false; bk.from='pat'; goView('book'); });
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ pt.id=b.dataset.go; pt.from=null; render(); });
}
function renderPatMemos(){
  let html=`<div class="reader"><div class="row"><button class="linkbtn" id="toList">‹ 패턴 목록</button></div>
    <h2 class="st">패턴 외우기 모음</h2><p class="muted" style="margin:0 0 8px">시험 전날과 당일 아침에 읽는 한 줄씩. 제목을 누르면 그 패턴으로 갑니다.</p>`;
  for(const subj of ['civ','rea']){
    const L=patsOf(subj); if(!L.length) continue;
    html+=`<div class="card"><b>${SUBJ[subj]}</b>${L.map(p=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><button class="linkbtn" data-pid="${p.id}" style="font-size:13px;text-align:left"><span class="tag ${p.level}" style="font-size:11px">${p.level}</span>${esc(p.title)}</button><div style="font-size:15px;line-height:1.6;font-weight:700">${md(p.memo)}</div></div>`).join('')}</div>`;
  }
  main.innerHTML=html+'</div>';
  main.querySelector('#toList').onclick=()=>{ pt.memo=false; render(); };
  main.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{ pt.memo=false; pt.id=b.dataset.pid; render(); });
}
// 또 나온 문장: 두 회차 이상 나온 지문. O/X 퀴즈 또는 목록
function repPool(){ const f=pt.rf; return P.repeats.filter(r=>(f.subj==='all'||r.subj===f.subj)&&r.rounds.length>=f.min); }
function repLast(r){ const s=S.rep[r.ref]; return s?s.l:-1; }
function repHtml(){
  const f=pt.rf, pool=repPool(), known=pool.filter(r=>repLast(r)===1).length, missed=pool.filter(r=>repLast(r)===0).length;
  const n3=P.repeats.filter(r=>r.rounds.length>=3).length, todo=pool.length-known;
  return `<div class="card"><b>또 나온 문장</b>
    <p style="margin:6px 0 0;font-size:15px;line-height:1.6">10년 동안 같은 문장이 두 번 이상 나왔다(세 번 이상 ${n3}개). <b>정오도 매번 같았다.</b> 이 문장이 보이면 생각하지 말고 바로 O/X.</p>
    <div class="chips">${[['all','둘 다'],['civ','민법'],['rea','학개론']].map(([k,l])=>`<button class="chipbtn ${f.subj===k?'on':''}" data-rs="${k}">${l}</button>`).join('')}<span style="width:6px"></span>${[[3,'3회 이상'],[2,'2회 이상']].map(([k,l])=>`<button class="chipbtn ${f.min===k?'on':''}" data-rm="${k}">${l}</button>`).join('')}</div>
    <div class="stat"><div><b>${pool.length}</b><span>문장</span></div><div><b>${known}</b><span>마지막에 맞힘</span></div><div><b>${missed}</b><span>마지막에 틀림</span></div></div>
    <div class="btns"><button class="btn n small" id="repGo">▶ O/X 퀴즈 ${todo||pool.length}개</button></div>
    <div class="btns" style="margin-top:8px">${missed?`<button class="btn x small" id="repMiss">틀린 것만 ${missed}개</button>`:''}<button class="btn ghost small" id="repList">목록으로 읽기</button></div></div>`;
}
function bindRep(){
  main.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{ pt.rf.subj=b.dataset.rs; keepY(renderPatList); });
  main.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ pt.rf.min=+b.dataset.rm; keepY(renderPatList); });
  const pool=repPool();
  main.querySelector('#repGo').onclick=()=>{ const q=pool.filter(r=>repLast(r)!==1); startDrill(q.length?q:pool,'quiz'); };
  const rm=main.querySelector('#repMiss'); if(rm) rm.onclick=()=>startDrill(pool.filter(r=>repLast(r)===0),'quiz');
  main.querySelector('#repList').onclick=()=>startDrill(pool,'list');
}
function startDrill(q,mode){ pt.drill={q, i:0, phase:'ask', pick:null, mode, ok:0}; window.scrollTo(0,0); renderDrill(); }
function renderDrill(){
  const d=pt.drill, quit=()=>{ pt.drill=null; pt.tab='rep'; render(); };
  if(d.mode==='list'){
    main.innerHTML=`<div class="reader"><div class="row"><button class="linkbtn" id="dx">‹ 패턴</button><span class="muted" style="font-size:12px">${d.q.length}개</span></div>
      <h2 class="st">또 나온 문장</h2>
      <div class="row" style="margin-bottom:4px"><span class="muted" style="font-size:12px">${pt.hide?'지문을 누르면 정답과 근거가 열립니다.':'빨간 줄은 바꾼 말, 초록은 바로잡은 말.'}</span><button class="chipbtn ${pt.hide?'on':''}" id="hideAns">${pt.hide?'답 가림':'답 가리기'}</button></div>
      <ul class="oxl ${pt.hide?'hideans':''}" id="oxl">${d.q.map(patOxHtml).join('')}</ul></div>`;
    main.querySelector('#dx').onclick=quit;
    main.querySelector('#hideAns').onclick=()=>{ pt.hide=!pt.hide; keepY(renderDrill); };
    bindOx(); return;
  }
  if(d.i>=d.q.length){
    main.innerHTML=`<div class="card center"><div class="verdict ${d.ok===d.q.length?'ok':''}">${d.q.length}개 중 ${d.ok}개 맞힘</div><p class="muted">틀린 문장은 '틀린 것만'으로 다시 돌릴 수 있습니다.</p><div class="btns"><button class="btn n" id="dx">끝</button></div></div>`;
    main.querySelector('#dx').onclick=quit; return;
  }
  const r=d.q[d.i];
  let html=`<div class="row"><span class="muted">${d.i+1} / ${d.q.length}</span><button class="btn ghost small" style="flex:0 0 auto;padding:6px 10px" id="dx">그만</button></div>
  <div class="card"><div><span class="tag">${SUBJ[r.subj]} · ${r.rounds.join('·')}회</span></div><div class="muted" style="font-size:12px;margin-top:4px">${esc(r.st||'')}</div>
    <div class="ask truth">이 문장은 <b>옳은 말인가요?</b><span>${r.rounds.length}개 회차에 나온 문장. 정오는 매번 같았다.</span></div>`;
  if(r.case) html+=`<div class="passage"><b>사례</b> ${esc(r.case)}</div>`;
  if(d.phase==='ask'){
    html+=`<div class="choice">${esc(r.text)}</div><div class="btns"><button class="btn o" data-p="O">O 옳은 말</button><button class="btn x" data-p="X">X 틀린 말</button></div></div>`;
  } else {
    const ok=d.pick===r.ox, df=r.ox==='X'&&r.fix?wordDiff(r.text,r.fix):null;
    html+=`<div class="choice">${df?df.a:esc(r.text)}</div>
      <div class="verdict ${ok?'ok':'bad'}">${ok?'맞음':'틀림'} · 정답은 ${r.ox==='O'?'O 옳은 말':'X 틀린 말'}</div>
      ${r.ox==='X'&&r.fix?`<div class="fix">바로잡기: ${df?df.b:esc(r.fix)}</div>`:''}
      ${r.why?`<div class="reason">${md(r.why)}</div>`:''}
      <button class="bookbtn" data-book="${r.sec}">📖 개념서에서 읽기 · ${esc(r.st||'')}</button>
      <div class="btns" style="margin-top:12px"><button class="btn n" id="dn">다음</button></div></div>`;
  }
  main.innerHTML=html;
  main.querySelector('#dx').onclick=quit;
  main.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    d.pick=b.dataset.p; d.phase='show'; const ok=d.pick===r.ox; if(ok) d.ok++;
    const s=S.rep[r.ref]||{n:0,ok:0}; S.rep[r.ref]={n:(s.n||0)+1, ok:(s.ok||0)+(ok?1:0), l:ok?1:0, d:today()}; save(); renderDrill();
  });
  const dn=main.querySelector('#dn'); if(dn) dn.onclick=()=>{ d.i++; d.phase='ask'; d.pick=null; window.scrollTo(0,0); renderDrill(); };
  main.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{ bk.sec=b.dataset.book; bk.memo=false; bk.from='pat'; goView('book'); });
}
// 오늘 탭: 아직 안 외운 패턴이 있으면 맨 위에 띄운다
function patTodayHtml(){
  if(!P||!P.patterns.length) return '';
  const all=P.patterns, n=all.filter(p=>S.pat[p.id]).length; if(n>=all.length) return '';
  const left=all.filter(p=>!S.pat[p.id]), nx=left.find(p=>p.level==='S')||left[0];
  return `<div class="card" style="border:1.5px solid var(--ink)"><div class="row"><b>★ 먼저: 이것만 패턴</b><span class="muted">외움 ${n} / ${all.length}</span></div>
    <p class="muted" style="margin:4px 0 8px">여러 회차 선지가 한 규칙으로 갈리는 자리 ${all.length}개. 하나에 2~3분.<br>다음: ${esc(nx.title)}</p>
    <div class="btns"><button class="btn n small" data-pat="${nx.id}">다음 패턴 읽기</button><button class="btn ghost small" id="toPat">패턴 목록</button></div></div>`;
}
// 개념서 섹션 → 그 섹션이 들어간 패턴
function secPatHtml(sid){
  if(!P) return '';
  const L=P.patterns.filter(p=>p.secs.some(s=>s.id===sid)); if(!L.length) return '';
  return L.slice(0,3).map(p=>`<button class="patbtn" data-pat="${p.id}">★ 이 논점이 든 패턴 · ${esc(p.title)}</button>`).join('');
}

/* ===== 시작 ===== */
function migrate(){
  let n=0; const t=today(); const byId={}; D.cards.forEach(c=>byId[c.id]=c);
  // 다시 시작해도 바뀐 시각은 그대로 둔다: 다른 기기가 새 카드로 공부한 기록이 있으면 그쪽이 이기게
  const restart=id=>{ const st=S.cards[id]; if(!st||st.st===0) return; S.cards[id]={st:1,k:[],last:st.last,due:t,miss:st.miss||0,seen:st.seen||0}; if(SNAP) SNAP['c/'+id]=JSON.stringify(S.cards[id]); n++; };
  if(D.version&&S.dataver!==D.version){ (D.reset||[]).forEach(restart); }
  for(const [id,st] of Object.entries(S.cards)){ const c=byId[id]; if(c&&st.a&&st.a!==c.mode+':'+c.ox) restart(id); }
  if(D.version) S.dataver=D.version;
  if(n){ S.notice=`카드 ${n}장의 질문 방식이나 정답이 바뀌어 그 카드만 기록을 다시 시작합니다.`; }
  save();
}
fetch('cards.json?v='+Date.now()).then(r=>r.json()).then(d=>{ D=d; migrate(); render(); syncUI(); syncNow(); loadBook().then(()=>{ if(view==='today'&&!session) renderToday(); }).catch(()=>{}); loadPat().then(()=>{ if(view==='today'&&!session) renderToday(); }).catch(()=>{}); }).catch(e=>{ main.innerHTML='<div class="card">카드 자료(cards.json)를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>'; });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
